<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Beam Pharmacy personal task manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<title>Beam Pharmacy</title>
<style>
:root{--green:#55b30b;--blue:#153f91;--ink:#20242b;--muted:#858b94;--line:#e9ecef;--soft:#f7f9f7;--red:#d34c4c}
*{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:620px;min-height:100dvh;margin:auto;background:#fff;padding:env(safe-area-inset-top) 20px calc(26px + env(safe-area-inset-bottom));}
header{display:flex;align-items:center;gap:12px;padding:22px 0 18px;border-bottom:1px solid var(--line)}
header img{width:54px;height:54px;object-fit:contain;border-radius:9px}
.brand{font-size:23px;letter-spacing:.5px;font-weight:800;color:var(--blue);line-height:1}.brand span{color:#858585;font-weight:650}
.tag{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:6px}
h1{font-size:27px;letter-spacing:-.7px;margin:25px 0 4px} .sub{color:var(--muted);font-size:13px}
.summary{margin:20px 0;background:#f5f8f2;border-radius:16px;padding:17px}
.sumtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#687064}
.count{font-size:27px;font-weight:750;color:var(--blue);margin-top:4px}
.track{height:6px;background:#e2e9dc;border-radius:8px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:var(--green);transition:width .2s}
.addtitle{font-weight:700;margin:24px 0 10px}
input,select{font:inherit;border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff;color:var(--ink);min-width:0}
#taskInput{width:100%;font-size:15px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
button{font:inherit;cursor:pointer;border:0}
.add{margin-top:10px;width:100%;padding:13px;border-radius:11px;background:var(--green);color:#fff;font-weight:700}
.filters{display:flex;gap:7px;margin:14px 0 10px}
.filters button{flex:1;padding:10px 8px;border-radius:10px;background:#f4f5f5;color:#6f747b;font-size:13px}
.filters button.active{background:#edf5e8;color:#397d0b;font-weight:700}
.list{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:11px;padding:15px 2px;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);flex:none}
.taskbody{flex:1;min-width:0}.taskname{font-size:14px;overflow-wrap:anywhere}.task.done .taskname{text-decoration:line-through;color:#a0a5aa}
.meta{display:flex;gap:7px;align-items:center;margin-top:5px;font-size:11px;color:var(--muted)}
.pill{border-radius:20px;padding:3px 7px;background:#f1f2f3}.pill.high{background:#fff0e9;color:#bd542b}.pill.urgent{background:#fff0f0;color:#c23c3c}
.del{background:transparent;color:#a6abb0;padding:7px;font-size:18px}
.empty{text-align:center;padding:38px 10px;color:#9ba1a5;font-size:13px}
.foot{text-align:center;color:#a3a8ad;font-size:10px;letter-spacing:1.5px;padding:25px 0}
@media(min-width:600px){body{padding:22px 0}.app{border-radius:22px;min-height:calc(100dvh - 44px);box-shadow:0 8px 40px #18231a0d;padding-left:34px;padding-right:34px}}
</style>
</head>
<body><main class="app">
<header><img src="logo.png" alt="Beam Pharmacy logo" onerror="this.style.display='none'"><div><div class="brand">BEAM <span>PHARMACY</span></div><div class="tag">PERSONAL TASK MANAGER</div></div></header>
<h1>My Tasks</h1><div class="sub" id="today"></div>
<section class="summary"><div class="sumtop"><span>ความคืบหน้าวันนี้</span><span id="percent">0%</span></div><div class="count"><span id="remaining">0</span> <small style="font-size:12px;font-weight:500;color:#818981">งานที่ยังไม่เสร็จ</small></div><div class="track"><div class="fill" id="progress"></div></div></section>
<div class="addtitle">เพิ่มงานใหม่</div>
<form id="form"><input id="taskInput" placeholder="วันนี้ต้องทำอะไรบ้าง?" autocomplete="off" required>
<div class="controls"><select id="priority"><option value="ปกติ">ความสำคัญ: ปกติ</option><option value="สำคัญ">ความสำคัญ: สำคัญ</option><option value="ด่วนมาก">ความสำคัญ: ด่วนมาก</option></select><input id="due" type="date" aria-label="กำหนดวัน"></div>
<button class="add" type="submit">＋ เพิ่มงาน</button></form>
<div class="addtitle" style="display:flex;justify-content:space-between;align-items:center"><span>รายการของฉัน</span><span id="total" style="font-size:12px;color:#92989d;font-weight:500"></span></div>
<nav class="filters"><button class="active" data-filter="all">ทั้งหมด</button><button data-filter="active">กำลังทำ</button><button data-filter="done">เสร็จแล้ว</button></nav>
<section class="list" id="list"></section>
<div class="foot">BEAM PHARMACY · SIMPLE & FOCUSED</div>
</main>
<script>
const KEY='beam-pharmacy-tasks-v1';let tasks=[];let filter='all';
try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){tasks=[]}
const $=id=>document.getElementById(id);
$('today').textContent=new Intl.DateTimeFormat('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function render(){
 const done=tasks.filter(t=>t.done).length,remaining=tasks.length-done,pct=tasks.length?Math.round(done/tasks.length*100):0;
 $('remaining').textContent=remaining;$('percent').textContent=pct+'%';$('progress').style.width=pct+'%';$('total').textContent=tasks.length+' งาน';
 const shown=tasks.filter(t=>filter==='all'||(filter==='active'&&!t.done)||(filter==='done'&&t.done));
 $('list').innerHTML='';
 if(!shown.length){$('list').innerHTML='<div class="empty">ยังไม่มีรายการในหมวดนี้<br>เพิ่มงานแรกของคุณได้เลย</div>';return}
 shown.forEach(t=>{
  const row=document.createElement('div');row.className='task'+(t.done?' done':'');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','ทำเครื่องหมายเสร็จ');cb.addEventListener('change',()=>{t.done=cb.checked;save()});
  const body=document.createElement('div');body.className='taskbody';
  const name=document.createElement('div');name.className='taskname';name.textContent=t.title;
  const meta=document.createElement('div');meta.className='meta';
  const p=document.createElement('span');p.className='pill'+(t.priority==='ด่วนมาก'?' urgent':t.priority==='สำคัญ'?' high':'');p.textContent=t.priority;meta.append(p);
  if(t.due){const d=document.createElement('span');d.textContent=new Date(t.due+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});meta.append(d)}
  body.append(name,meta);
  const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','ลบงาน');del.addEventListener('click',()=>{if(confirm('ลบงานนี้ใช่ไหม?')){tasks=tasks.filter(x=>x.id!==t.id);save()}});
  row.append(cb,body,del);$('list').append(row);
 });
}
$('form').addEventListener('submit',e=>{e.preventDefault();const title=$('taskInput').value.trim();if(!title)return;tasks.unshift({id:Date.now(),title,priority:$('priority').value,due:$('due').value,done:false});$('taskInput').value='';$('due').value='';$('priority').value='ปกติ';filter='all';document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));save();});
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));render()}));
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
